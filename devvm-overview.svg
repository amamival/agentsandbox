<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">devvm architecture overview</title>
  <desc id="desc">A host workspace passes through the devvm supervisor into an isolated, persistent NixOS virtual machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#202b45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="180" fill="#2563eb" opacity=".10"/>
  <circle cx="170" cy="540" r="230" fill="#06b6d4" opacity=".08"/>

  <text x="72" y="82" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700">devvm</text>
  <text x="72" y="116" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19">Dangerous agents, contained in a real NixOS VM.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="172" width="280" height="220" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="92" y="194" width="240" height="42" rx="10" fill="#1e293b"/>
    <text x="212" y="221" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Terminal</text>
    <circle cx="110" cy="214" r="5" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    <path d="m113.5 217.5 4 4" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="259" y="206" width="18" height="18" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    <path d="M264 215h8m-4-4v8M289 211h8m-8 4h8m-8 4h8M312 211l8 8m0-8-8 8" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="105" y="277" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18">$ devvm up</text>
    <text x="105" y="313" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">/workspace</text>
    <text x="105" y="350" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Linux host</text>
    <text x="105" y="373" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Your files stay on your terms</text>
  </g>

  <path d="M352 282H486" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="356" y="259" fill="#a5f3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">controlled mounts</text>

  <g filter="url(#shadow)">
    <rect x="494" y="207" width="212" height="150" rx="75" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
    <path d="M552 282h96M600 234v96" stroke="#67e8f9" stroke-width="3" opacity=".35"/>
    <circle cx="600" cy="282" r="37" fill="#0e7490" stroke="#a5f3fc" stroke-width="2"/>
    <path d="m582 282 12 12 25-27" fill="none" stroke="#ecfeff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="388" text-anchor="middle" fill="#cffafe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">devvm supervisor</text>
  </g>

  <path d="M714 282H798" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="806" y="150" width="322" height="300" rx="24" fill="url(#vm)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="830" y="176" width="274" height="58" rx="12" fill="#0f172a"/>
    <text x="854" y="212" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">Isolated NixOS VM</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">
      <rect x="830" y="254" width="126" height="64" rx="12" fill="#1d4ed8" opacity=".75"/>
      <text x="893" y="281" text-anchor="middle" fill="#dbeafe" font-weight="650">Private /nix</text>
      <text x="893" y="302" text-anchor="middle" fill="#bfdbfe" font-size="13">no host reuse</text>

      <rect x="978" y="254" width="126" height="64" rx="12" fill="#0f766e" opacity=".80"/>
      <text x="1041" y="281" text-anchor="middle" fill="#ccfbf1" font-weight="650">Persistence</text>
      <text x="1041" y="302" text-anchor="middle" fill="#99f6e4" font-size="13">explicit paths</text>

      <rect x="830" y="336" width="126" height="64" rx="12" fill="#6d28d9" opacity=".78"/>
      <text x="893" y="363" text-anchor="middle" fill="#ede9fe" font-weight="650">systemd</text>
      <text x="893" y="384" text-anchor="middle" fill="#ddd6fe" font-size="13">real boot</text>

      <rect x="978" y="336" width="126" height="64" rx="12" fill="#9a3412" opacity=".78"/>
      <text x="1041" y="363" text-anchor="middle" fill="#ffedd5" font-weight="650">KVM + SSH</text>
      <text x="1041" y="384" text-anchor="middle" fill="#fed7aa" font-size="13">native workflow</text>
    </g>
  </g>

  <text x="72" y="500" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Reproducible config</text>
  <circle cx="258" cy="494" r="3" fill="#64748b"/>
  <text x="276" y="500" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Project-aware instances</text>
  <circle cx="474" cy="494" r="3" fill="#64748b"/>
  <text x="492" y="500" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">No host /nix exposure</text>
</svg>
