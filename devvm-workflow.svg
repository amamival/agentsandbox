<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">devvm workflow and use cases</title>
  <desc id="desc">Replace a Dockerfile with configuration.nix, then initialize, boot, attach, and iterate on a real NixOS VM from any recent Linux host.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="40" r="210" fill="#2563eb" opacity=".10"/>
  <circle cx="55" cy="650" r="220" fill="#06b6d4" opacity=".07"/>

  <text x="600" y="68" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="35" font-weight="700">Replace your Dockerfile with configuration.nix.</text>
  <text x="600" y="103" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">No NixOS host required.</text>

  <g filter="url(#shadow)">
    <rect x="62" y="160" width="206" height="210" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <g transform="translate(44)">
      <ellipse cx="121" cy="220" rx="23" ry="29" fill="#0f172a" stroke="#67e8f9" stroke-width="2"/>
      <path d="M99 216c-10 7-12 19-5 25l10-17m39-8c10 7 12 19 5 25l-10-17" fill="#164e63" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="121" cy="228" rx="14" ry="18" fill="#e2e8f0"/>
      <circle cx="114" cy="211" r="2.5" fill="#f8fafc"/>
      <circle cx="128" cy="211" r="2.5" fill="#f8fafc"/>
      <circle cx="114" cy="211" r="1" fill="#0f172a"/>
      <circle cx="128" cy="211" r="1" fill="#0f172a"/>
      <path d="m116 217 5 4 5-4-5-3Z" fill="#fb923c"/>
      <path d="M107 248h12l-7 5h-10Zm16 0h12l5 5h-10Z" fill="#fb923c"/>
    </g>
    <text x="165" y="282" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">Linux host</text>
    <text x="165" y="310" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Debian · Ubuntu</text>
    <text x="165" y="333" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Fedora · Arch · NixOS</text>
    <text x="165" y="355" text-anchor="middle" fill="#67e8f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">any recent distribution</text>
  </g>

  <path d="M274 265H324" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="332" y="160" width="222" height="210" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="443" cy="213" r="27" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <path d="M443 198v30m-15-15h30" stroke="#cffafe" stroke-width="4" stroke-linecap="round"/>
    <text x="443" y="274" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18">$ devvm init</text>
    <text x="443" y="311" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">configuration.nix</text>
    <text x="443" y="339" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">describe the whole system</text>
  </g>

  <path d="M560 265H610" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="618" y="160" width="222" height="210" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="729" cy="213" r="27" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <path d="m720 199 23 14-23 14Z" fill="#dbeafe"/>
    <text x="729" y="274" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18">$ devvm up</text>
    <text x="729" y="311" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">build · boot · attach</text>
    <text x="729" y="339" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">one command</text>
  </g>

  <path d="M846 265H896" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="904" y="160" width="234" height="210" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="926" y="184" width="190" height="38" rx="9" fill="#1e293b"/>
    <text x="1021" y="209" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Keep working</text>
    <text x="943" y="258" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">$ devvm ssh</text>
    <text x="943" y="288" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">$ devvm exec</text>
    <text x="943" y="318" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">$ devvm mount</text>
    <text x="943" y="348" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">edit config · run up again</text>
  </g>

  <path d="M1020 382v24c0 22-18 40-40 40H769c-22 0-40-18-40-40v-24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" opacity=".75"/>
  <text x="875" y="438" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">iterate</text>

  <text x="62" y="504" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Built for</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    <rect x="62" y="528" width="244" height="70" rx="16" fill="#172033" stroke="#334155"/>
    <circle cx="88" cy="563" r="8" fill="#22d3ee" opacity=".85"/>
    <text x="108" y="568" fill="#e2e8f0">Autonomous coding agents</text>

    <rect x="326" y="528" width="244" height="70" rx="16" fill="#172033" stroke="#334155"/>
    <circle cx="352" cy="563" r="8" fill="#60a5fa" opacity=".85"/>
    <text x="372" y="558" fill="#e2e8f0">Agent-assisted kernel</text>
    <text x="372" y="578" fill="#e2e8f0">patching</text>

    <rect x="590" y="528" width="244" height="70" rx="16" fill="#172033" stroke="#334155"/>
    <circle cx="616" cy="563" r="8" fill="#8b5cf6" opacity=".85"/>
    <text x="636" y="558" fill="#e2e8f0">NixOS module</text>
    <text x="636" y="578" fill="#e2e8f0">development</text>

    <rect x="854" y="528" width="284" height="70" rx="16" fill="#172033" stroke="#334155"/>
    <circle cx="880" cy="563" r="8" fill="#f97316" opacity=".85"/>
    <text x="900" y="558" fill="#e2e8f0">systemd service development</text>
    <text x="900" y="578" fill="#e2e8f0">and testing</text>
  </g>
</svg>
