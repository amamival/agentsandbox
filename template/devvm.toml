# Declarative launcher policy

[vm]
# Number of guest vCPUs. Must be at least 1 and no more than the host CPU count. No auto mode.
vcpus = 4

# Maximum memory the guest may use. Page-reporting keeps actual usage close to internal process demand.
memoryMiB = 8192

# Trust the host OS CA bundle in the guest (e.g. corporate MITM proxy roots on non-NixOS hosts).
# Host must already include your corporate root in its system trust store.
# useHostCerts = false

# Optional libvirt domain XML template. Paste your working domain XML.
# Use this when adding GPU, USB, evdev devices, pulseaudio sockets, or similar settings.
# The guest configuration is derived from this template after editing.
# libvirtDomainXml = '''
# <domain type='kvm'>
# <!-- Generated from configs and runtime paths:
#   <name/>
#   <uuid/>
#   <memory/>
#   <os>
#     <type arch='x86_64' machine='q35'>hvm</type>
#     <kernel/>
#     <initrd/>
#     <cmdline/>
#   </os>
# -->
# <!-- vCPU count is generated; existing <vcpu> attributes are kept:
#   <vcpu cpuset='0-3'/>
# -->
#   <cpu mode='host-passthrough' migratable='off'/>
#   <memoryBacking>
#     <source type='memfd'/>
#     <access mode='shared'/>
#   </memoryBacking>
#   <features>
#     <acpi/>
#     <apic/>
#   </features>
#   <devices>
#     <!-- Replaced as a unit by target dir='nix'|'persistent':
#       <filesystem type='mount'>
#         <target dir='nix'/>
#       </filesystem>
#       <filesystem type='mount'>
#         <target dir='persistent'/>
#       </filesystem>
#     -->
#     <serial type='pty'>
#       <target port='0'/>
#     </serial>
#     <console type='pty'>
#       <target type='serial' port='0'/>
#     </console>
#     <rng model='virtio'>
#       <backend model='random'>/dev/urandom</backend>
#     </rng>
#     <!-- All interface elements are replaced:
#       <interface type='user'>
#         <backend type='passt'/>
#         <portForward proto='' address=''>
#           <range start='' end='' to=''/>
#         </portForward>
#       </interface>
#     -->
#   </devices>
# </domain>
# '''

[protection]
# Start the guest with its own /nix writable.
# Required when building with Nix or installing packages from inside the guest.
# If a build starts from the host, /nix is writable only while that build is running.
mutableNixStore = true

# Start the guest with its own /nix/var/nix/profiles writable.
# Required when running nixos-rebuild from inside the guest.
# If a build starts from the host, these paths are writable only while that build is running.
# This requires mutableNixStore = true.
mutableSystemProfile = false

[mounts]
# Bind mounts from the host to the guest.
# Files owned by the host's current user and group are exposed in the guest as uid 1000, gid 100.
# Files owned by other user IDs are translated within the /etc/subuid range.
# "target" = { source = "rel", readonly = bool }

# The example above mounts the file or directory at relative path rel from the
# project directory into /workspace/{target} in the guest.
# `target` may be a descendant directory, but it must not contain ../
# "repo" = { source = ".", readonly = false }

[allowedHosts]
# Domain policy reserved for the future proxy. v0.2 stores edits but does not enforce it.
# "*" = {} # Disable host restrictions.
"cache.nixos.org" = {} # No subdomain matching.
"*.pool.ntp.org" = {}  # Match the domain and its subdomains.
# Fetch the allowlist from https://api.github.com/meta
"github.com" = { fetch_allowlist = [
  "hooks",
  "web",
  "api",
  "git",
  "github_enterprise_importer",
  "packages",
  "pages",
  "importer",
  "actions",
  "actions_macos",
  "codespaces",
  "copilot",
] }

[portForwards]
# Forward guest listening ports to the host.
# If you use multiple hostnames, be careful not to collide on SSH ports in particular.
# `proto` must be `tcp` or `udp`. `address`, `dev`, and `host` are host-side network settings.
# `host_end` defaults to `host` itself. If set, `guest..` are
# forwarded one-to-one to `host..host_end` ports.
ssh = { proto = "tcp", address = "127.0.0.1", dev = "lo", host = 2223, guest = 22 }


# Hostname-specific policy. Tables here override the same base section
# for that hostname. A hostname corresponds to `flake.nix`'s `nixosConfiguration.{HOSTNAME}`.
#[hosts.test.vm]
#memoryMiB = 4096

#[hosts.test.portForwards]
#ssh = { proto = "tcp", address = "127.0.0.1", dev = "lo", host = 2224, guest = 22 }

